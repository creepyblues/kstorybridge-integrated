name: Preview Deployment Test

# This workflow runs smoke tests on Vercel preview deployments
# Triggered by Vercel deployment webhook (configure in Vercel dashboard)

on:
  deployment_status:

jobs:
  test-preview:
    name: Test Preview Deployment
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Install Playwright
        working-directory: apps/dashboard
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests on preview
        working-directory: apps/dashboard
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
        run: npm run test:preview

      - name: Comment on PR with results
        if: always() && github.event.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview Deployment Test')
            );

            const output = `### Preview Deployment Test Results

            **Preview URL**: ${{ github.event.deployment_status.target_url }}
            **Status**: ${{ job.status }}

            ${job.status === 'success' ? '✅ All smoke tests passed!' : '❌ Some tests failed'}

            [View deployment](${{ github.event.deployment_status.target_url }})
            `;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: output
              });
            }
