<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Email System - KStoryBridge</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0891b2;
            border-bottom: 3px solid #0891b2;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .test-section {
            margin: 30px 0;
            padding: 25px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
            transition: border-color 0.3s ease;
        }
        .test-section:hover {
            border-color: #0891b2;
        }
        .test-section h2 {
            color: #0891b2;
            margin-top: 0;
            display: flex;
            align-items: center;
        }
        .test-section h2::before {
            content: '📧';
            margin-right: 10px;
            font-size: 1.2em;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0891b2;
        }
        button {
            background: linear-gradient(135deg, #0891b2 0%, #0d9488 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin: 5px;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(8, 145, 178, 0.3);
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background-color: #1e293b;
            color: #e2e8f0;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #334155;
        }
        .success { color: #10b981; font-weight: bold; }
        .error { color: #ef4444; font-weight: bold; }
        .info { color: #3b82f6; }
        .warning { color: #f59e0b; }
        .template-preview {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-success { background: #10b981; }
        .status-error { background: #ef4444; }
        .status-pending { background: #f59e0b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 KStoryBridge Email System Tester</h1>
        
        <div class="test-section">
            <h2>Welcome Email Test</h2>
            <input type="text" id="welcomeName" placeholder="User Name (e.g., John Doe)" value="Test User">
            <input type="email" id="welcomeEmail" placeholder="Email Address" value="">
            <select id="welcomeAccountType">
                <option value="buyer">Content Buyer</option>
                <option value="creator">Content Creator</option>
            </select>
            <button onclick="testWelcomeEmail()">Send Welcome Email</button>
            <button onclick="previewWelcomeEmail()">Preview Template</button>
        </div>

        <div class="test-section">
            <h2>Custom Email Test</h2>
            <input type="email" id="customTo" placeholder="To Email Address" value="">
            <input type="text" id="customSubject" placeholder="Email Subject" value="Test Email from KStoryBridge">
            <textarea id="customHtml" rows="4" placeholder="HTML Content (optional)"></textarea>
            <textarea id="customText" rows="3" placeholder="Plain Text Content"></textarea>
            <button onclick="testCustomEmail()">Send Custom Email</button>
        </div>

        <div class="test-section">
            <h2>Template Email Test</h2>
            <input type="email" id="templateTo" placeholder="To Email Address" value="">
            <select id="templateType">
                <option value="welcome">Welcome Email</option>
                <option value="verification_reminder">Verification Reminder</option>
                <option value="password_reset">Password Reset Confirmation</option>
                <option value="tier_upgrade">Tier Upgrade</option>
            </select>
            <button onclick="testTemplateEmail()">Send Template Email</button>
        </div>

        <div class="test-section">
            <h2>Email System Health Check</h2>
            <button onclick="checkEmailHealth()">Check System Health</button>
            <button onclick="testEdgeFunction()">Test Edge Function</button>
            <button onclick="clearResults()">Clear Results</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://dlrnrgcoguxlkkcitlpd.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRscm5yZ2NvZ3V4bGtrY2l0bHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE3OTIzMzQsImV4cCI6MjA2NzM2ODMzNH0.KWYF7TvoA0I3iyoIbyYIyTSlJcIyPH6yCfHueEEMIlA";

        function log(message, type = '') {
            const resultDiv = document.getElementById('result');
            const timestamp = new Date().toLocaleTimeString();
            const className = type ? ` class="${type}"` : '';
            resultDiv.innerHTML = `<div${className}>[${timestamp}] ${message}</div>` + resultDiv.innerHTML;
        }

        async function testWelcomeEmail() {
            const name = document.getElementById('welcomeName').value;
            const email = document.getElementById('welcomeEmail').value;
            const accountType = document.getElementById('welcomeAccountType').value;

            if (!name || !email) {
                log('❌ Please enter both name and email', 'error');
                return;
            }

            log(`🔄 Sending welcome email to ${email} (${accountType})...`, 'info');

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/send-email`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'apikey': SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify({
                        to: email,
                        subject: `Welcome to KStoryBridge, ${name}! 🎉`,
                        template: 'welcome',
                        templateData: {
                            userName: name,
                            userEmail: email,
                            accountType: accountType,
                            dashboardUrl: 'https://dashboard.kstorybridge.com',
                            loginUrl: 'https://dashboard.kstorybridge.com/signin'
                        }
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    log(`✅ Welcome email sent successfully! Message ID: ${data.messageId}`, 'success');
                    log(`📧 Check your inbox at: ${email}`, 'success');
                } else {
                    log(`❌ Failed to send welcome email: ${data.error || JSON.stringify(data)}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testCustomEmail() {
            const to = document.getElementById('customTo').value;
            const subject = document.getElementById('customSubject').value;
            const html = document.getElementById('customHtml').value;
            const text = document.getElementById('customText').value;

            if (!to || !subject || (!html && !text)) {
                log('❌ Please fill in all required fields', 'error');
                return;
            }

            log(`🔄 Sending custom email to ${to}...`, 'info');

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/send-email`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'apikey': SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify({
                        to,
                        subject,
                        html: html || undefined,
                        text: text || undefined,
                        from: 'KStoryBridge Test <test@kstorybridge.com>'
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    log(`✅ Custom email sent successfully! Message ID: ${data.messageId}`, 'success');
                } else {
                    log(`❌ Failed to send custom email: ${data.error || JSON.stringify(data)}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testTemplateEmail() {
            const to = document.getElementById('templateTo').value;
            const templateType = document.getElementById('templateType').value;

            if (!to) {
                log('❌ Please enter an email address', 'error');
                return;
            }

            log(`🔄 Sending ${templateType} template email to ${to}...`, 'info');

            const templateData = getTemplateData(templateType);
            const subject = getSubjectForTemplate(templateType);

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/send-email`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'apikey': SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify({
                        to,
                        subject,
                        template: templateType === 'welcome' ? 'welcome' : undefined,
                        templateData: templateType === 'welcome' ? templateData : undefined,
                        html: templateType !== 'welcome' ? getHtmlForTemplate(templateType, templateData) : undefined,
                        text: templateType !== 'welcome' ? getTextForTemplate(templateType, templateData) : undefined
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    log(`✅ Template email sent successfully! Message ID: ${data.messageId}`, 'success');
                } else {
                    log(`❌ Failed to send template email: ${data.error || JSON.stringify(data)}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        function getTemplateData(templateType) {
            switch (templateType) {
                case 'welcome':
                    return {
                        userName: 'Test User',
                        userEmail: document.getElementById('templateTo').value,
                        accountType: 'buyer',
                        dashboardUrl: 'https://dashboard.kstorybridge.com'
                    };
                case 'tier_upgrade':
                    return {
                        userName: 'Test User',
                        newTier: 'Pro'
                    };
                default:
                    return { userName: 'Test User' };
            }
        }

        function getSubjectForTemplate(templateType) {
            switch (templateType) {
                case 'welcome': return 'Welcome to KStoryBridge, Test User! 🎉';
                case 'verification_reminder': return 'Please verify your email address';
                case 'password_reset': return 'Your password has been reset';
                case 'tier_upgrade': return 'Account upgraded to Pro tier!';
                default: return 'Test Email';
            }
        }

        function getHtmlForTemplate(templateType, data) {
            switch (templateType) {
                case 'verification_reminder':
                    return `<p>Hi ${data.userName},</p><p>Please verify your email address.</p>`;
                case 'password_reset':
                    return `<p>Hi ${data.userName},</p><p>Your password has been reset.</p>`;
                case 'tier_upgrade':
                    return `<p>Hi ${data.userName},</p><p>Your account has been upgraded to ${data.newTier}!</p>`;
                default:
                    return '<p>Test email</p>';
            }
        }

        function getTextForTemplate(templateType, data) {
            switch (templateType) {
                case 'verification_reminder':
                    return `Hi ${data.userName},\\n\\nPlease verify your email address.`;
                case 'password_reset':
                    return `Hi ${data.userName},\\n\\nYour password has been reset.`;
                case 'tier_upgrade':
                    return `Hi ${data.userName},\\n\\nYour account has been upgraded to ${data.newTier}!`;
                default:
                    return 'Test email';
            }
        }

        async function previewWelcomeEmail() {
            const name = document.getElementById('welcomeName').value || 'Test User';
            const email = document.getElementById('welcomeEmail').value || 'test@example.com';
            const accountType = document.getElementById('welcomeAccountType').value;

            log('📄 Generating welcome email preview...', 'info');
            
            // This would show a preview - for now just log the data
            log(`Preview data: Name: ${name}, Email: ${email}, Type: ${accountType}`, 'info');
            log('✅ Welcome email template loaded (preview feature coming soon)', 'success');
        }

        async function checkEmailHealth() {
            log('🔍 Checking email system health...', 'info');

            try {
                // Test Edge Function availability
                const response = await fetch(`${SUPABASE_URL}/functions/v1/send-email`, {
                    method: 'OPTIONS',
                    headers: {
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'apikey': SUPABASE_ANON_KEY
                    }
                });

                if (response.ok) {
                    log('✅ Edge Function is accessible', 'success');
                } else {
                    log('❌ Edge Function health check failed', 'error');
                }

                // Check environment
                log('📋 System Status:', 'info');
                log(`- Supabase URL: ${SUPABASE_URL}`, 'info');
                log('- Edge Function: send-email', 'info');
                log('- Email Provider: Resend', 'info');
                log('✅ Health check completed', 'success');

            } catch (error) {
                log(`❌ Health check error: ${error.message}`, 'error');
            }
        }

        async function testEdgeFunction() {
            log('🧪 Testing Edge Function directly...', 'info');

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/send-email`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'apikey': SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify({
                        to: 'test@example.com',
                        subject: 'Edge Function Test',
                        text: 'This is a test email from the Edge Function'
                    })
                });

                const data = await response.json();
                
                log(`Edge Function Response (${response.status}):`, 'info');
                log(JSON.stringify(data, null, 2), 'info');

                if (response.ok) {
                    log('✅ Edge Function test completed successfully', 'success');
                } else {
                    log('⚠️ Edge Function returned an error (check response above)', 'warning');
                }
            } catch (error) {
                log(`❌ Edge Function test failed: ${error.message}`, 'error');
            }
        }

        function clearResults() {
            document.getElementById('result').innerHTML = '';
            log('🧹 Results cleared', 'info');
        }

        // Initialize
        log('🚀 Email system tester loaded!', 'success');
        log('📧 Enter your email address and test the welcome email system', 'info');
    </script>
</body>
</html>
