<!DOCTYPE html>
<html>
<head>
    <title>OAuth Debug Helper</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .debug-section { background: white; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        code { background: #eee; padding: 2px 4px; }
    </style>
</head>
<body>
    <h1>🔍 OAuth Debug Helper</h1>
    <p>Use this page to debug OAuth issues. Open browser console for detailed logs.</p>
    
    <div class="debug-section">
        <h3>Current Environment</h3>
        <div id="environment"></div>
    </div>
    
    <div class="debug-section">
        <h3>URL Analysis</h3>
        <div id="url-analysis"></div>
    </div>
    
    <div class="debug-section">
        <h3>Storage Analysis</h3>
        <div id="storage-analysis"></div>
    </div>
    
    <div class="debug-section">
        <h3>Supabase Test</h3>
        <div id="supabase-test"></div>
        <button onclick="testSupabase()">Test Supabase Connection</button>
    </div>

    <script>
        console.log('🔍 OAuth Debug Helper Loaded');
        
        // Environment analysis
        document.getElementById('environment').innerHTML = `
            <p><strong>Hostname:</strong> ${window.location.hostname}</p>
            <p><strong>Origin:</strong> ${window.location.origin}</p>
            <p><strong>Protocol:</strong> ${window.location.protocol}</p>
            <p><strong>User Agent:</strong> ${navigator.userAgent}</p>
            <p><strong>Cookies Enabled:</strong> ${navigator.cookieEnabled}</p>
        `;
        
        // URL analysis
        const urlParams = new URLSearchParams(window.location.search);
        const urlInfo = {
            'Full URL': window.location.href,
            'Search': window.location.search,
            'Hash': window.location.hash,
            'Account Type': urlParams.get('account_type') || 'Not found',
            'User ID': urlParams.get('user_id') || 'Not found',
            'Email': urlParams.get('email') || 'Not found',
            'Complete': urlParams.get('complete') || 'Not found'
        };
        
        let urlHtml = '';
        Object.entries(urlInfo).forEach(([key, value]) => {
            const className = value === 'Not found' ? 'error' : 'info';
            urlHtml += `<p><strong>${key}:</strong> <span class="${className}">${value}</span></p>`;
        });
        document.getElementById('url-analysis').innerHTML = urlHtml;
        
        // Storage analysis
        const storageInfo = {
            'localStorage keys': localStorage.length > 0 ? Object.keys(localStorage).join(', ') : 'Empty',
            'sessionStorage keys': sessionStorage.length > 0 ? Object.keys(sessionStorage).join(', ') : 'Empty',
            'Document cookies': document.cookie || 'No cookies'
        };
        
        let storageHtml = '';
        Object.entries(storageInfo).forEach(([key, value]) => {
            storageHtml += `<p><strong>${key}:</strong> ${value}</p>`;
        });
        
        // Check for OAuth-related storage
        const oauthKeys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.includes('oauth') || key.includes('auth') || key.includes('supabase')) {
                oauthKeys.push(key);
            }
        }
        if (oauthKeys.length > 0) {
            storageHtml += `<p><strong>OAuth-related keys:</strong> <span class="info">${oauthKeys.join(', ')}</span></p>`;
        }
        
        document.getElementById('storage-analysis').innerHTML = storageHtml;
        
        // Supabase connection test
        window.testSupabase = async function() {
            const testDiv = document.getElementById('supabase-test');
            testDiv.innerHTML = '<p>Testing Supabase connection...</p>';
            
            try {
                // Test basic fetch to Supabase
                const response = await fetch('https://dlrnrgcoguxlkkcitlpd.supabase.co/rest/v1/', {
                    headers: {
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRscm5yZ2NvZ3V4bGtrY2l0bHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE3OTIzMzQsImV4cCI6MjA2NzM2ODMzNH0.KWYF7TvoA0I3iyoIbyYIyTSlJcIyPH6yCfHueEEMIlA'
                    }
                });
                
                if (response.ok) {
                    testDiv.innerHTML = '<p class="success">✅ Supabase connection successful</p>';
                } else {
                    testDiv.innerHTML = `<p class="error">❌ Supabase connection failed: ${response.status}</p>`;
                }
            } catch (error) {
                testDiv.innerHTML = `<p class="error">❌ Supabase connection error: ${error.message}</p>`;
            }
        };
        
        console.log('🔍 Debug Helper Analysis:', {
            url: urlInfo,
            storage: storageInfo,
            timestamp: new Date().toISOString()
        });
    </script>
</body>
</html>
