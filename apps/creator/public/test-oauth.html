<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Creator Signup Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .step { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .logs { background: #f8f9fa; padding: 10px; margin: 10px 0; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>OAuth Creator Signup Test</h1>
    
    <div class="step">
        <h3>Step 1: Test SessionStorage</h3>
        <button onclick="testSessionStorage()">Test SessionStorage</button>
        <div id="sessionResult" class="logs"></div>
    </div>
    
    <div class="step">
        <h3>Step 2: Simulate OAuth Initiation</h3>
        <button onclick="simulateOAuthStart()">Simulate OAuth Start</button>
        <div id="oauthResult" class="logs"></div>
    </div>
    
    <div class="step">
        <h3>Step 3: Simulate OAuth Callback</h3>
        <button onclick="simulateOAuthCallback()">Simulate OAuth Callback</button>
        <div id="callbackResult" class="logs"></div>
    </div>
    
    <div class="step">
        <h3>Step 4: Test URL Parameters</h3>
        <button onclick="testUrlParams()">Test URL Parameters</button>
        <div id="urlResult" class="logs"></div>
    </div>

    <script>
        function testSessionStorage() {
            const result = document.getElementById('sessionResult');
            result.innerHTML = '';
            
            try {
                // Test storing account type
                sessionStorage.setItem('oauth_account_type', 'creator');
                result.innerHTML += 'Stored "creator" in sessionStorage\n';
                
                // Test retrieving
                const stored = sessionStorage.getItem('oauth_account_type');
                result.innerHTML += `Retrieved: "${stored}"\n`;
                
                // Test cleanup
                sessionStorage.removeItem('oauth_account_type');
                const afterRemove = sessionStorage.getItem('oauth_account_type');
                result.innerHTML += `After removal: ${afterRemove}\n`;
                
                result.innerHTML += '\n✅ SessionStorage test passed!';
                result.className = 'logs success';
            } catch (error) {
                result.innerHTML = `❌ SessionStorage test failed: ${error.message}`;
                result.className = 'logs';
            }
        }
        
        function simulateOAuthStart() {
            const result = document.getElementById('oauthResult');
            
            // Simulate the OAuth initiation flow
            const accountType = 'creator';
            sessionStorage.setItem('oauth_account_type', accountType);
            
            result.innerHTML = `OAuth initiation simulation:
Account type stored: ${accountType}
SessionStorage content: ${sessionStorage.getItem('oauth_account_type')}

✅ OAuth start simulation complete!`;
            result.className = 'logs success';
        }
        
        function simulateOAuthCallback() {
            const result = document.getElementById('callbackResult');
            
            // Simulate the callback logic
            const urlParams = new URLSearchParams('?account_type=creator');
            let urlAccountType = urlParams.get('account_type');
            
            // Fallback to sessionStorage if URL param is missing
            if (!urlAccountType) {
                const storedAccountType = sessionStorage.getItem('oauth_account_type');
                if (storedAccountType) {
                    urlAccountType = storedAccountType;
                    sessionStorage.removeItem('oauth_account_type');
                }
            }
            
            result.innerHTML = `OAuth callback simulation:
URL account_type: ${urlParams.get('account_type')}
Final account_type: ${urlAccountType}
SessionStorage after cleanup: ${sessionStorage.getItem('oauth_account_type')}

✅ OAuth callback simulation complete!`;
            result.className = 'logs success';
        }
        
        function testUrlParams() {
            const result = document.getElementById('urlResult');
            
            // Test URL parameter handling
            const testUrl = 'http://localhost:8084/auth/callback?account_type=creator#access_token=abc123';
            const url = new URL(testUrl);
            const params = new URLSearchParams(url.search);
            
            result.innerHTML = `URL parameter test:
Test URL: ${testUrl}
Search params: ${url.search}
Hash: ${url.hash}
Account type from params: ${params.get('account_type')}

✅ URL parameter test complete!`;
            result.className = 'logs success';
        }
        
        // Auto-run basic test on page load
        window.onload = function() {
            document.querySelector('[onclick="testSessionStorage()"]').click();
        };
    </script>
</body>
</html>
